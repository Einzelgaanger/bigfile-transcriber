# A string used to distinguish different Supabase projects on the same host.
project_id = "fvdwagawkounsofwsyen"

[api]
enabled = true

[db]
major_version = 17

[auth]
enable_signup = false
site_url = "https://prodg.studio"
additional_redirect_urls = [
  "http://127.0.0.1:18765",
  "http://localhost:18765",
  "https://prodg.studio",
  "https://www.prodg.studio",
  "https://bigfile-transcriber.onrender.com",
]

# Keep the email provider ON so existing users can sign in.
# [auth.email].enable_signup maps to the provider toggle — false blocks logins too.
[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
file_size_limit = "5GiB"

[functions.submit-transcription]
verify_jwt = true

[functions.poll-transcription]
verify_jwt = false
